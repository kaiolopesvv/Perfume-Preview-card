<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabrielle Essence Eau De Parfum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="produto">

        <div class="produto-imagem-box">
            <img src="./assets/Perfume.jpg" alt="Perfume Gabrielle Chanel">
        </div>

        <div class="produto-info">

            <span class="categoria">PERFUME</span>

            <h1>Gabrielle Essence Eau De Parfum</h1>

            <p class="descricao">
                A floral, solar and voluptuous interpretation
                composed by Olivier Polge, Perfumer-Creator
                for the House of CHANEL.
            </p>

            <div class="precos">
                <span class="preco-atual">$149.99</span>
                <span class="preco-antigo">$169.99</span>
            </div>

            <button class="botao-carrinho" type="button">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">
                    <circle cx="9" cy="21" r="1"/>
                    <circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                Add to Cart
            </button>

        </div>

    </main>

</body>
</html>
